<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f3f5;
        }
        .register-box {
            width: 100%;
            max-width: 500px;
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="register-box">
    <h2 class="text-center">Rejestracja</h2>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="mb-3">
            <label for="firstName" class="form-label">Imię</label>
            <input th:field="*{firstName}" class="form-control" id="firstName">
            <div th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Nazwisko</label>
            <input th:field="*{lastName}" class="form-control" id="lastName">
            <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="login" class="form-label">Login</label>
            <input th:field="*{login}" class="form-control" id="login">
            <div th:if="${#fields.hasErrors('login')}" th:errors="*{login}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input th:field="*{email}" type="email" class="form-control" id="email">
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Hasło</label>
            <input th:field="*{password}" type="password" class="form-control" id="password">
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Powtórz hasło</label>
            <input th:field="*{confirmPassword}" type="password" class="form-control" id="confirmPassword">
            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-success w-100">Zarejestruj się</button>
        <p class="mt-3 text-center">Masz już konto? <a href="/login">Zaloguj się</a></p>
    </form>
</div>
</body>
</html>
