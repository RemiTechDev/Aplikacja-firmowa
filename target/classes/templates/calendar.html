<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kalendarz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .calendar-table {
            table-layout: fixed;
            width: 100%;
            margin-top: 2rem;
        }
        .calendar-table td {
            height: 100px;
            vertical-align: top;
            padding: 0.5rem;
            border: 1px solid #dee2e6;
            cursor: pointer;
        }
        .calendar-table th {
            text-align: center;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="text-center">Kalendarz</h2>
    <p class="text-center" th:text="${#dates.format(#dates.createNow(), 'dd-MM-yyyy HH:mm')}">Aktualna data</p>

    <table class="table calendar-table">
        <thead>
        <tr>
            <th>Pon</th>
            <th>Wt</th>
            <th>Śr</th>
            <th>Czw</th>
            <th>Pt</th>
            <th>Sob</th>
            <th>Nd</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="week : ${calendarWeeks}">
            <td th:each="day : ${week}"
                th:text="${day}"
                th:onclick="|handleDayClick('${day}')|">
            </td>
        </tr>
        </tbody>
    </table>

    <div id="alertBox" class="alert alert-warning d-none text-center" role="alert">
        Opcja dodawania spotkań lub wydarzeń jest tylko dla zarejestrowanych użytkowników
    </div>

    <ul class="mt-4">
        <li th:each="m : ${meetings}" th:text="'[' + ${m.date} + '] ' + ${m.title}">Spotkanie</li>
    </ul>
</div>

<script>
    function handleDayClick(day) {
        // Zakładamy, że jesteś niezalogowany
        let loggedIn = false; // Możesz dynamicznie zastąpić to Thymeleafem np. th:if
        if (!loggedIn) {
            const alertBox = document.getElementById("alertBox");
            alertBox.classList.remove("d-none");
            setTimeout(() => alertBox.classList.add("d-none"), 3000);
        }
    }
</script>
</body>
</html>
