<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kalendarz Spotkań</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        table.calendar {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .calendar th, .calendar td {
            border: 1px solid #ccc;
            height: 100px;
            vertical-align: top;
            padding: 5px;
        }

        .calendar th {
            background-color: #f8f9fa;
            text-align: center;
        }

        .calendar td.today {
            background-color: #e3f2fd;
        }

        .meeting {
            background-color: #dee2e6;
            margin: 2px 0;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .day-number {
            font-weight: bold;
            margin-bottom: 4px;
            display: block;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">Kalendarz Spotkań</h2>

    <table class="calendar">
        <thead>
        <tr>
            <th>Pon</th>
            <th>Wt</th>
            <th>Śr</th>
            <th>Czw</th>
            <th>Pt</th>
            <th>Sob</th>
            <th>Ndz</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="week : ${calendarWeeks}">
            <td th:each="day : ${week}"
                th:classappend="${day.equals(T(java.time.LocalDate).now())} ? 'today'">
                <span class="day-number" th:text="${day.dayOfMonth}">1</span>
                <div th:each="meeting : ${meetings}"
                     th:if="${meeting.dateTime.toLocalDate().equals(day)}"
                     class="meeting"
                     th:text="${#temporals.format(meeting.dateTime, 'HH:mm')} + ' - ' + ${meeting.title}">
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
