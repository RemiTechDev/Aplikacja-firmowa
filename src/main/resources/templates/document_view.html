<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${doc.title}">Dokument</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0" th:text="${doc.title}">Dokument</h3>
        <div class="d-flex gap-2">
            <a th:href="@{'/documents/file/' + ${doc.id}}" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-eye"></i> Otwórz plik
            </a>
            <a th:href="@{'/documents/download/' + ${doc.id}}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-download"></i> Pobierz
            </a>
            <a href="/admin/documents" class="btn btn-sm btn-outline-dark">⟵ Wróć</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row gy-2">
                <div class="col-md-3"><strong>Typ:</strong></div>
                <div class="col-md-9" th:text="${doc.type != null ? doc.type : '—'}">PDF</div>

                <div class="col-md-3"><strong>Status:</strong></div>
                <div class="col-md-9">
                    <span class="badge"
                          th:classappend="${
                               doc.status != null && doc.status.name() == 'AKTYWNY'       ? ' bg-success' :
                               doc.status != null && doc.status.name() == 'Z_POPRAWKAMI' ? ' bg-warning text-dark' :
                               doc.status != null && doc.status.name() == 'ARCHIWALNY'   ? ' bg-secondary' :
                               doc.status != null && doc.status.name() == 'USUNIĘTY'     ? ' bg-dark' :
                               ' bg-light text-dark'
                          }"
                          th:text="${doc.status != null ? doc.status : '—'}">AKTYWNY</span>
                </div>

                <div class="col-md-3"><strong>Wrzucił:</strong></div>
                <div class="col-md-9" th:text="${doc.user != null ? doc.user.firstName + ' ' + doc.user.lastName : '—'}">—</div>

                <div class="col-md-3"><strong>Utworzono:</strong></div>
                <div class="col-md-9" th:text="${doc.created != null ? #temporals.format(doc.created,'yyyy-MM-dd HH:mm')
                : '—'}">2025-01-01 12:00</div>

                <div class="col-md-3"><strong>MIME:</strong></div>
                <div class="col-md-9" th:text="${doc.mimeType != null ? doc.mimeType : '—'}">application/pdf</div>
            </div>
        </div>
    </div>

    <!-- Komentarze -->
    <div class="card">
        <div class="card-header"><i class="bi bi-chat-dots"></i> Komentarze</div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(comments)}" class="text-muted mb-3">Brak komentarzy</div>

            <div th:each="c : ${comments}" class="mb-3 border-bottom pb-2">
                <div class="small text-muted">
                    <span th:text="${c.author != null ? c.author.firstName + ' ' + c.author.lastName : '—'}">—</span>
                    •
                    <span th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">2025-01-01 12:00</span>
                </div>
                <div th:text="${c.content}">Treść komentarza…</div>
            </div>

            <form th:action="@{'/documents/' + ${doc.id} + '/comments'}" method="post" class="row g-2">
                <input type="hidden" name="redirect" value="view"/>
                <div class="col-md-10">
                    <input class="form-control" name="content" placeholder="Dodaj komentarz..." required>
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-primary" type="submit">Dodaj</button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
