<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historia logowań</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">📜 Historia logowań</h3>
        <a href="/admin/dashboard/extended" class="btn btn-outline-secondary">← Powrót do panelu</a>
    </div>

    <!-- Flash messages -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${#httpServletRequest.getSession(false)?.getAttribute('error')}" class="alert alert-danger"
         th:text="${#httpServletRequest.getSession(false).getAttribute('error')}"></div>
    <div th:if="${#httpServletRequest.getSession(false)?.getAttribute('message')}" class="alert alert-success"
         th:text="${#httpServletRequest.getSession(false).getAttribute('message')}"></div>

    <!-- FORM 1: Usuń zaznaczone -->
    <form id="bulkForm" method="post" th:action="@{/admin/history/delete-selected}" class="mb-2">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="d-flex gap-2 mb-2">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="checkAll">
                <label class="form-check-label" for="checkAll">Zaznacz wszystkie</label>
            </div>
            <button type="submit" class="btn btn-outline-danger btn-sm">Usuń zaznaczone</button>
        </div>

        <div class="table-responsive">
            <table class="table table-sm table-bordered align-middle bg-white">
                <thead class="table-light">
                <tr>
                    <th style="width:36px;"></th>
                    <th>Imię i nazwisko</th>
                    <th>Rola</th>
                    <th>Logowanie</th>
                    <th>Wylogowanie</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${events.content}">
                    <td>
                        <input class="form-check-input row-check" type="checkbox" name="ids" th:value="${e.id}">
                    </td>
                    <td th:text="${e.name}">Jan Kowalski</td>
                    <td th:text="${e.role}">ADMIN_ROLE</td>
                    <td th:text="${#temporals.format(e.loginTime, 'yyyy-MM-dd HH:mm')}">2025-08-10 10:00</td>
                    <td th:text="${e.logoutTime != null ? #temporals.format(e.logoutTime, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                </tr>
                <tr th:if="${events.content.size() == 0}">
                    <td colspan="5" class="text-center text-muted">Brak danych</td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>

    <!-- FORM 2: Usuń wszystkie (osobny formularz, NIE wewnątrz bulkForm!) -->
    <form th:action="@{/admin/history/delete-all}" method="post"
          onsubmit="return confirm('Na pewno usunąć WSZYSTKIE wpisy?');">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger btn-sm">Usuń wszystkie</button>
    </form>

    <!-- Paginacja -->
    <nav th:if="${events.totalPages > 1}" class="mt-3">
        <ul class="pagination">
            <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                <a class="page-link" th:href="@{|/admin/history?page=${events.number-1}&size=${events.size}|}">«</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, events.totalPages-1)}"
                th:classappend="${i == events.number} ? 'active'">
                <a class="page-link" th:text="${i+1}"
                   th:href="@{|/admin/history?page=${i}&size=${events.size}|}">1</a>
            </li>
            <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                <a class="page-link" th:href="@{|/admin/history?page=${events.number+1}&size=${events.size}|}">»</a>
            </li>
        </ul>
    </nav>

</div>

<script>
    // zaznacz/odznacz wszystkie
    document.getElementById('checkAll')?.addEventListener('change', function (e) {
        document.querySelectorAll('.row-check').forEach(function (ch) {
            ch.checked = e.target.checked;
        });
    });

    // walidacja: blokuj submit gdy nic nie zaznaczono
    document.getElementById('bulkForm')?.addEventListener('submit', function (e) {
        const anyChecked = Array.from(document.querySelectorAll('.row-check')).some(ch => ch.checked);
        if (!anyChecked) {
            e.preventDefault();
            alert('Zaznacz co najmniej jeden wpis do usunięcia.');
        }
    });
</script>
</body>
</html>
