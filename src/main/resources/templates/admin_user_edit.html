<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Edytuj użytkownika</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-4">Edytuj użytkownika</h2>

<form th:action="@{'/admin/users/update/' + ${user.id}}" method="post">
    <div class="mb-3">
        <label for="login" class="form-label">Login</label>
        <input type="text" id="login" name="login" th:value="${user.login}" class="form-control" readonly>
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" th:value="${user.email}" class="form-control" readonly>
    </div>

    <div class="mb-3">
        <label for="enabled" class="form-label">Aktywne konto</label>
        <input type="checkbox" id="enabled" name="enabled" th:checked="${user.enabled}" class="form-check-input">
    </div>

    <div class="mb-3">
        <label for="roleIds" class="form-label">Rola</label>
        <select multiple class="form-select" id="roleIds" name="roleIds">
            <option th:each="role : ${allRoles}"
                    th:value="${role.id}"
                    th:text="${role.name.name()}"
                    th:selected="${user.roles.contains(role)}">
            </option>

        </select>
    </div>

    <div class="mb-3">
        <label for="newPassword" class="form-label">Nowe hasło</label>
        <input type="password" id="newPassword" name="newPassword" class="form-control">
        <div class="form-text">Pozostaw puste, jeśli nie chcesz zmieniać hasła</div>
    </div>

    <button type="submit" class="btn btn-primary">Zapisz zmiany</button>
    <a href="/admin/users" class="btn btn-secondary ms-2">Anuluj</a>
</form>

</body>
</html>
