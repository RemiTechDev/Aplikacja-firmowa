<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel administratora - użytkownicy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
<h1>Lista użytkowników</h1>

<!-- Dodany przycisk do tworzenia nowego użytkownika -->
<div class="d-flex justify-content-end mb-3">
    <a href="/admin/users/create" class="btn btn-success">+ Dodaj użytkownika</a>
</div>

<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Login</th>
        <th>Email</th>
        <th>Imię</th>
        <th>Nazwisko</th>
        <th>Rola(e)</th>
        <th>Aktywny</th>
        <th>Akcje</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.login}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td>
            <span th:each="role : ${user.roles}" th:text="${role.name}" class="badge bg-secondary me-1"></span>
        </td>
        <td>
            <span th:if="${user.enabled}" class="text-success">Tak</span>
            <span th:unless="${user.enabled}" class="text-danger">Nie</span>
        </td>
        <td>
            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-primary"> Edytuj</a>
            <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-danger ms-1"
               onclick="return confirm('Czy na pewno chcesz usunąć tego użytkownika?')"> Usuń</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
