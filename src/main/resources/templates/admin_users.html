<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Lista użytkowników — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-4">

    <!-- HEADER z powrotem -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Lista użytkowników</h2>
        <div class="d-flex gap-2">
            <a href="/admin/dashboard/extended" class="btn btn-outline-secondary">
                ⟵ Powrót do panelu
            </a>
            <a href="/admin/users/create" class="btn btn-success">
                + Dodaj użytkownika
            </a>
        </div>
    </div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover mb-0">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Login</th>
                <th>Email</th>
                <th>Imię</th>
                <th>Nazwisko</th>
                <th>Rola(e)</th>
                <th>Aktywny</th>
                <th>Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}">1</td>
                <td th:text="${u.login}">login</td>
                <td th:text="${u.email}">email@firma.pl</td>
                <td th:text="${u.firstName}">Jan</td>
                <td th:text="${u.lastName}">Kowalski</td>
                <td>
          <span th:each="r : ${u.roles}"
                class="badge bg-secondary me-1"
                th:text="${r.name}">USER_ROLE</span>
                </td>
                <td>
                    <span th:if="${u.enabled}" class="text-success">Tak</span>
                    <span th:unless="${u.enabled}" class="text-danger">Nie</span>
                </td>
                <td class="text-nowrap">
                    <a th:href="@{'/admin/users/edit/' + ${u.id}}" class="btn btn-sm btn-primary">Edytuj</a>
                    <a th:href="@{'/admin/users/delete/' + ${u.id}}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Usunąć użytkownika?');">Usuń</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="8" class="text-center text-muted py-4">Brak użytkowników</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
