<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dodaj użytkownika</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Dodaj nowego użytkownika</h2>

    <form action="/admin/users/create" method="post">
        <div class="mb-3">
            <label for="login" class="form-label">Login:</label>
            <input type="text" class="form-control" id="login" name="login" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Hasło:</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
            <label for="firstName" class="form-label">Imię:</label>
            <input type="text" class="form-control" id="firstName" name="firstName" required>
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Nazwisko:</label>
            <input type="text" class="form-control" id="lastName" name="lastName" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Role:</label><br/>
<!--            <div class="form-check form-check-inline">-->
<!--                <input class="form-check-input" type="checkbox" name="roleIds" id="roleUser" value="1">-->
<!--                <label class="form-check-label" for="roleUser">USER</label>-->
<!--            </div>-->
<!--            <div class="form-check form-check-inline">-->
<!--                <input class="form-check-input" type="checkbox" name="roleIds" id="roleStaff" value="2">-->
<!--                <label class="form-check-label" for="roleStaff">STAFF</label>-->
<!--            </div>-->
<!--            <div class="form-check form-check-inline">-->
<!--                <input class="form-check-input" type="checkbox" name="roleIds" id="roleManager" value="3">-->
<!--                <label class="form-check-label" for="roleManager">MANAGER</label>-->
<!--            </div>-->

<!--            <div class="form-check form-check-inline">-->
<!--                <input class="form-check-input" type="checkbox" name="roleIds" id="roleAdmin" value="4">-->
<!--                <label class="form-check-label" for="roleAdmin">ADMIN</label>-->
<!--            </div>-->
<!--        </div>-->


            <th:block th:each="role : ${roles}">
                <div class="form-check form-check-inline">
                    <input class="form-check-input"
                           type="checkbox"
                           th:id="${'role' + role.name}"
                           th:name="roleIds"
                           th:value="${role.id}">
                    <label class="form-check-label"
                           th:for="${'role' + role.name}"
                           th:text="${role.name}"></label>
                </div>
            </th:block>
        </div>


        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="enabled" name="enabled" checked>
            <label class="form-check-label" for="enabled">Konto aktywne</label>
        </div>

        <button type="submit" class="btn btn-primary">Dodaj użytkownika</button>
        <a href="/admin/users" class="btn btn-secondary">Anuluj</a>
    </form>
</div>

</body>
</html>
