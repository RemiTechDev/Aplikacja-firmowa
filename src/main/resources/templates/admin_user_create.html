<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Dodaj użytkownika — Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container py-4">

    <!-- HEADER z powrotem -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Dodaj użytkownika</h2>
        <div class="d-flex gap-2">
            <a href="/admin/dashboard/extended" class="btn btn-outline-secondary">⟵ Powrót do panelu</a>
            <a href="/admin/users" class="btn btn-outline-primary">Lista użytkowników</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/users/create}" method="post" class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Login</label>
                    <input class="form-control" type="text" name="login" required />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Hasło</label>
                    <input class="form-control" type="password" name="password" required />
                </div>
                <div class="col-md-4">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="email" required />
                </div>

                <div class="col-md-6">
                    <label class="form-label">Imię</label>
                    <input class="form-control" type="text" name="firstName" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nazwisko</label>
                    <input class="form-control" type="text" name="lastName" required />
                </div>

                <div class="col-12">
                    <label class="form-label">Role</label>
                    <div class="d-flex flex-wrap gap-2" th:each="r : ${roles}">
                        <label class="form-check">
                            <input class="form-check-input" type="checkbox" name="roleIds" th:value="${r.id}" />
                            <span class="ms-1" th:text="${r.name}">USER_ROLE</span>
                        </label>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="enabled" id="enabledCreate" />
                        <label class="form-check-label" for="enabledCreate">Aktywny</label>
                    </div>
                </div>

                <div class="col-12 d-flex justify-content-end gap-2">
                    <a href="/admin/users" class="btn btn-outline-secondary">Anuluj</a>
                    <button class="btn btn-success" type="submit">Utwórz</button>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>
