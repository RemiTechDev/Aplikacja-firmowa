<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Logowanie</title>
</head>
<body>
<h2>Logowanie</h2>
<form th:action="@{/login}" method="post">

    <label>Hasło: <input type="password" name="password" /></label><br/>
    <button type="submit">Zaloguj</button>
</form>
</body>
</html>
