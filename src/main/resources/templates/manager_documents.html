<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dokumenty — Menedżer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>📂 Dokumenty — Menedżer</h3>
        <div class="d-flex gap-2">
            <a href="/manager/dashboard" class="btn btn-sm btn-outline-secondary">⟵ Powrót do panelu</a>
            <a href="/calendar" class="btn btn-sm btn-outline-secondary">🗓️ Kalendarz</a>
        </div>
    </div>

    <div class="alert alert-info">
        Przegląd dokumentów. Menedżer może dodawać komentarze, przeglądać i edytować zgodnie z uprawnieniami.
    </div>

    <!-- Lista -->
    <div class="table-responsive">
        <table class="table table-bordered align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Tytuł</th>
                <th>Typ</th>
                <th>Status</th>
                <th>Wrzucił</th>
                <th>Data</th>
                <th style="width: 320px;">Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${docs}">
                <td>
                    <a th:href="@{'/documents/view/' + ${d.id}}" th:text="${d.title}">Nazwa</a>
                </td>
                <td th:text="${d.type != null ? d.type : '—'}">PDF</td>
                <td>
                    <span class="badge"
                          th:classappend="${
                             d.status != null && d.status.name() == 'AKTYWNY'       ? ' bg-success' :
                             d.status != null && d.status.name() == 'Z_POPRAWKAMI' ? ' bg-warning text-dark' :
                             d.status != null && d.status.name() == 'ARCHIWALNY'   ? ' bg-secondary' :
                             ' bg-light text-dark'
                          }"
                          th:text="${d.status != null ? d.status : '—'}">AKTYWNY</span>
                </td>
                <td th:text="${d.user != null ? d.user.firstName + ' ' + d.user.lastName : '—'}">—</td>
                <td th:text="${d.created != null ? #temporals.format(d.created,'yyyy-MM-dd HH:mm') : '—'}">2025-01-01 12:00</td>
                <td>
                    <div class="d-flex flex-wrap gap-2">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{'/documents/view/' + ${d.id}}">
                            <i class="bi bi-box-arrow-up-right"></i> Otwórz
                        </a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{'/documents/edit/' + ${d.id}}">
                            <i class="bi bi-pencil-square"></i> Edytuj
                        </a>

                        <!-- Szybki komentarz -->
                        <button class="btn btn-sm btn-outline-dark"
                                type="button"
                                th:attr="data-target=${'cmt-'+d.id}"
                                onclick="document.getElementById(this.getAttribute('data-target')).classList.toggle('d-none')">
                            <i class="bi bi-chat-dots"></i> Skomentuj
                        </button>

                        <!-- Usuwanie tylko jeśli masz własny endpoint i zgodę CSRF -->
                        <form th:action="@{'/documents/delete/' + ${d.id}}" method="post"
                              onsubmit="return confirm('Usunąć dokument?');" class="d-inline">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                <i class="bi bi-trash"></i> Usuń
                            </button>
                        </form>
                    </div>

                    <!-- szybki komentarz (z CSRF) -->
                    <div class="mt-2 d-none" th:id="${'cmt-'+d.id}">
                        <form th:action="@{'/documents/' + ${d.id} + '/comments'}" method="post" class="row g-2">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="col-9">
                                <input class="form-control form-control-sm" name="content"
                                       required placeholder="Treść komentarza...">
                            </div>
                            <div class="col-3 text-end">
                                <button class="btn btn-sm btn-primary" type="submit">Dodaj</button>
                            </div>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(docs)}">
                <td colspan="6" class="text-center text-muted">Brak dokumentów</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
