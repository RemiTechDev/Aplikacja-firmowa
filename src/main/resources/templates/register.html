<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rejestracja</title>
</head>
<body>
<h2>Rejestracja</h2>
<form th:action="@{/register}" method="post" th:object="${user}">
    <label>Login: <input type="text" th:field="*{login}" /></label><br/>
    <label>Email: <input type="email" th:field="*{email}" /></label><br/>
    <label>Hasło: <input type="password" th:field="*{password}" /></label><br/>
    <label>Imię: <input type="text" th:field="*{firstName}" /></label><br/>
    <label>Nazwisko: <input type="text" th:field="*{lastName}" /></label><br/>
    <button type="submit">Zarejestruj</button>
</form>
</body>
</html>
