<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dokumenty — Użytkownik</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body { background:#f6f7fb; }
        .app { min-height: 100vh; display:flex; }
        .sidebar { width:260px; background:#1f2a3a; color:#fff; padding:18px 14px; position:sticky; top:0; height:100vh; }
        .sidebar .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; margin-bottom:18px; }
        .sidebar a, .sidebar button { color:#dbe4ff; text-decoration:none; }
        .nav-item { display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:10px; margin:4px 0; }
        .nav-item:hover { background: rgba(255,255,255,.08); }
        .nav-item i { width:18px; text-align:center; }
        .content { flex:1; padding: 26px; }
        .page-title { font-size: 34px; font-weight: 800; margin-bottom: 14px; }
        .card-soft { border:1px solid #e6e8ef; border-radius:12px; }
        .table thead th { background:#fff; }
    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div class="brand">
            <i class="bi bi-person fs-4"></i>
            <div>
                <div class="fw-bold">User</div>
                <div class="small text-white-50">Panel użytkownika</div>
            </div>
        </div>

        <nav class="mt-2">
            <a class="nav-item" href="/user/dashboard">
                <i class="bi bi-bar-chart"></i>
                <span>Dashboard</span>
            </a>

            <a class="nav-item" href="/documents">
                <i class="bi bi-folder2"></i>
                <span>Dokumenty</span>
            </a>

            <a class="nav-item" href="/calendar">
                <i class="bi bi-calendar3"></i>
                <span>Kalendarz</span>
            </a>

            <form th:action="@{/logout}" method="post" class="m-0 mt-2">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="nav-item w-100 border-0 bg-transparent text-start">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Wyloguj się</span>
                </button>
            </form>
        </nav>
    </aside>

    <main class="content">
        <div class="d-flex justify-content-between align-items-center">
            <div class="page-title">Dokumenty</div>
            <a href="/user/dashboard" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Powrót do panelu
            </a>
        </div>

        <div class="alert alert-info">
            Użytkownik: podgląd własnych dokumentów + komentarze (bez edycji).
        </div>

        <!-- (Opcjonalnie) upload dla USER — jeśli chcesz, odkomentuj i odblokujemy w security/perm -->
        <!--
        <div class="card card-soft p-3 mb-3">
            <form th:action="@{/documents/upload}" method="post" enctype="multipart/form-data" class="row g-2 align-items-center">
                <input type="hidden" name="redirectTo" value="/documents"/>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-6">
                    <input class="form-control" type="file" name="file" required>
                </div>
                <div class="col-md-4">
                    <input class="form-control" type="text" name="title" placeholder="Tytuł (opcjonalnie)">
                </div>
                <div class="col-md-2 text-end">
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="bi bi-upload"></i> Wyślij
                    </button>
                </div>
            </form>
        </div>
        -->

        <div class="card card-soft">
            <div class="table-responsive">
                <table class="table table-bordered align-middle mb-0 bg-white">
                    <thead class="table-light">
                    <tr>
                        <th>Tytuł</th>
                        <th style="width: 90px;">Typ</th>
                        <th style="width: 140px;">Status</th>
                        <th style="width: 180px;">Data</th>
                        <th style="width: 360px;">Akcje</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="d : ${docs}">
                        <td>
                            <a th:href="@{'/documents/view/' + ${d.id} + '?back=/documents'}"
                               th:text="${d.title}">Nazwa</a>
                        </td>
                        <td th:text="${d.type != null ? d.type : '—'}">PDF</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${
                                     d.status != null && d.status.name() == 'AKTYWNY'       ? ' bg-success' :
                                     d.status != null && d.status.name() == 'Z_POPRAWKAMI' ? ' bg-warning text-dark' :
                                     d.status != null && d.status.name() == 'ARCHIWALNY'   ? ' bg-secondary' :
                                     ' bg-light text-dark border'
                                  }"
                                  th:text="${d.status != null ? d.status : '—'}">AKTYWNY</span>
                        </td>
                        <td th:text="${d.created != null ? #temporals.format(d.created,'yyyy-MM-dd HH:mm') : '—'}">—</td>

                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{'/documents/file/' + ${d.id}}">
                                    <i class="bi bi-eye"></i> Otwórz
                                </a>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{'/documents/download/' + ${d.id}}">
                                    <i class="bi bi-download"></i> Pobierz
                                </a>
                                <a class="btn btn-sm btn-outline-dark"
                                   th:href="@{'/documents/view/' + ${d.id} + '?back=/documents'}">
                                    <i class="bi bi-chat-dots"></i> Komentarze
                                </a>

                            </div>

                            <div class="mt-2 d-none" th:id="${'cmt-'+d.id}">
                                <form th:action="@{'/documents/' + ${d.id} + '/comments'}" method="post" class="row g-2">
                                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="redirectTo" value="/documents"/>
                                    <div class="col-9">
                                        <input class="form-control form-control-sm" name="content" required placeholder="Treść komentarza...">
                                    </div>
                                    <div class="col-3 text-end">
                                        <button class="btn btn-sm btn-success w-100" type="submit">Dodaj</button>
                                    </div>
                                </form>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(docs)}">
                        <td colspan="5" class="text-center text-muted py-3">Brak dokumentów</td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>
</body>
</html>
